[theme]
primaryColor = "#2c6a4c"
font = "sans serif"
baseRadius = "medium"
headingFontWeights = [700, 650, 600]

[theme.light]
primaryColor = "#2c6a4c"
backgroundColor = "#fbfaf6"
secondaryBackgroundColor = "#eef3ee"
textColor = "#1f2a24"
borderColor = "#dbe3dc"

[theme.light.sidebar]
backgroundColor = "#eef3ee"

[theme.dark]
primaryColor = "#6fbf8f"
backgroundColor = "#131915"
secondaryBackgroundColor = "#1d2620"
textColor = "#eef1ec"
borderColor = "#2e3a32"

[theme.dark.sidebar]
backgroundColor = "#18201b"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"  # pas de bouton « Deploy » : l'appli reste sur cette machine

[server]
address = "localhost"  # n'écoute que sur cette machine, pas sur le réseau local
headless = true
maxUploadSize = 2000  # Mo : une OCS GE départementale pèse environ 550 Mo
